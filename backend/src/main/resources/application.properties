spring.application.name=airline-system

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/airline_system?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:airline_app}
spring.datasource.password=${DB_PASSWORD:Airline@1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

server.port=${PORT:8080}